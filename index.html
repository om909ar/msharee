</style></head><body><aside><div class="brand"><div class="logo" id="brandIcon"></div><div><strong>إدارة المشاريع</strong><small>المشاريع والميزانيات</small></div></div><div class="side-label">المتابعة وأقسام السنوات</div><nav id="navigation"></nav><div class="backup-box"><button class="backup-button" onclick="downloadBackup()"><span id="backupIcon"></span>تحميل نسخة احتياطية</button><small>جميع السنوات والمشاريع وبياناتها</small></div><div class="foot"><b>نسخة مبدئية للتجربة</b>الحفظ على هذا الجهاز فقط</div></aside><main><header><span>إدارة المشاريع <span style="color:#b5c5c3"> / </span><span id="pageLabel">الرئيسية</span></span><div class="head-user"><span class="date" id="today"></span><div class="avatar">م</div></div></header><div id="content"></div><div class="demo">التعديلات محفوظة في هذا المتصفح فقط.</div></main><dialog id="editor"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="editor.close()" aria-label="إغلاق">×</button></div><form id="form"><div class="fields" id="fields"></div><div id="budgetNote"></div><div class="error" id="error" role="alert"></div><div class="form-footer"><button type="button" class="secondary" onclick="editor.close()">إلغاء</button><button class="primary" type="submit">حفظ البيانات</button></div></form></dialog><dialog id="deleter"><div class="modal-head"><h2>تأكيد الحذف</h2><button class="close" onclick="deleter.close()" aria-label="إغلاق">×</button></div><div style="padding:25px"><div id="deleteText"></div><div class="form-footer"><button class="secondary" onclick="deleter.close()">إلغاء</button><button class="primary" style="background:#b85151" id="deleteConfirm">حذف</button></div></div></dialog><div class="toast" id="toast" role="status"></div>
<script>
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',folder:'<path d="M3 7V5h6l3 3h9v12H3z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M21 10h-7v5h7m-4-2.5h.1"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',plus:'<path d="M12 5v14M5 12h14"/>'};const icon=n=>'<svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true">'+icons[n]+'</svg>';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n/100);const ar=n=>new Intl.NumberFormat('ar-SA',{useGrouping:false}).format(n);const amount=n=>Math.round(n*100);const dateAdd=d=>{let t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()+d);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};const sampleYear=new Date().getFullYear();
const seed={years:[sampleYear],nodes:[]};
const KEY='project-management-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed);if(!Array.isArray(data.nodes)||!Array.isArray(data.years))throw Error()}catch{data=structuredClone(seed)}const sampleIds=new Set(['b1','p1','s1','s2','p2','b2','p3','p4','b3','p5']);if(!localStorage.getItem('pm-empty-start-v2')){data.nodes=data.nodes.filter(n=>!sampleIds.has(n.id));data.nodes.forEach(n=>{if(sampleIds.has(n.parent))n.parent=null});data.years=[...new Set([sampleYear,...data.nodes.map(n=>n.year)])];try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem('pm-empty-start-v2','1')}catch{}}data.nodes.forEach(n=>{n.type='project';if(n.status==='قائم')n.status='لم يبدأ'});try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}let tenderDrafts=[],tenderCount=0;let view='home',selected=null,editing=null,addParent=null,addType=null,deleteId=null;const get=id=>data.nodes.find(n=>n.id===id);const children=id=>data.nodes.filter(n=>n.parent===id);const total=ns=>ns.reduce((a,n)=>a+n.budget,0);const allocated=id=>total(children(id));const remain=n=>n.budget-allocated(n.id);const projectNodes=()=>data.nodes.filter(n=>n.type==='project');function days(n){if(!n.due)return null;const t=new Date();t.setHours(0,0,0,0);const d=new Date(n.due+'T00:00:00');return Math.round((d-t)/86400000)}const alerts=()=>projectNodes().filter(n=>n.status!=='مكتمل'&&days(n)!==null&&days(n)<=30).sort((a,b)=>days(a)-days(b));const humanDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ar-SA',{calendar:'gregory',day:'numeric',month:'short',year:'numeric'}):'لم يحدد';function badge(n){return '<span class="badge '+(n.status==='مكتمل'?'green':n.status==='جارٍ التنفيذ'?'':'gray')+'">'+esc(n.status)+'</span>'}function path(n){const list=[];let p=get(n.parent);while(p){list.unshift(p.name);p=get(p.parent)}return list.join(' / ')}function notify(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',3200)}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{notify('تعذر الحفظ على الجهاز. لا تغلق الصفحة قبل حفظ بياناتك.');return false}}function backupSnapshot(){return {format:'project-management-backup',version:1,exportedAt:new Date().toISOString(),data:structuredClone(data)}}function downloadBackup(){try{const snapshot=backupSnapshot();const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');const t=new Date();const stamp=[t.getFullYear(),String(t.getMonth()+1).padStart(2,'0'),String(t.getDate()).padStart(2,'0')].join('-')+'-'+[t.getHours(),t.getMinutes(),t.getSeconds()].map(n=>String(n).padStart(2,'0')).join('-');link.href=url;link.download='project-management-backup-'+stamp+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('تم طلب تنزيل النسخة. تأكد من وجود الملف في التنزيلات.')}catch{notify('تعذر تحميل النسخة. حاول مرة أخرى.')}}function go(v,id=null){view=v;selected=id;render();window.scrollTo(0,0)}
function stat(label,val,hint,ic){return '<div class="stat"><div class="stat-top">'+label+'<span class="stat-icon">'+icon(ic)+'</span></div><div class="value">'+val+'</div><div class="hint">'+hint+'</div></div>'}function row(n,depth=0){const used=allocated(n.id),pct=n.budget?Math.min(100,used/n.budget*100):0;return '<tr class="'+(depth?'child-row':'parent-row')+'" style="--depth:'+Math.min(depth,4)+'"><td class="name">'+(depth?'<span class="child-label">مشروع فرعي</span>':'')+'<strong>'+esc(n.name)+'</strong><small>'+esc(n.code)+' · '+(esc(n.status)+' · '+(children(n.id).length?ar(children(n.id).length)+' مشاريع فرعية':'مشروع واحد'))+'</small></td><td class="money">'+money(n.budget)+'</td><td class="money">'+money(used)+'<div class="progress"><i style="width:'+pct+'%"></i></div></td><td class="money" style="color:var(--green)">'+money(remain(n))+'</td><td>'+badge(n)+'</td><td><div class="actions"><button class="text-btn" onclick="openAdd(\''+n.id+'\')">'+'إضافة مشروع فرعي'+'</button><button class="text-btn" onclick="go(\'detail\',\''+n.id+'\')">التفاصيل</button><button class="text-btn" onclick="openEdit(\''+n.id+'\')">تعديل</button><button class="text-btn danger" onclick="askDelete(\''+n.id+'\')">حذف</button></div></td></tr>'}function branchRows(n,depth=0){return row(n,depth)+children(n.id).map(c=>branchRows(c,depth+1)).join('')}function countdown(n){if(n.status==='مكتمل')return '<span class="badge green">مكتمل</span>';const d=days(n);return '<span class="badge '+(d===null?'gray':d<0?'red':'')+'">'+(d===null?'لم يحدد موعد الانتهاء':d<0?'متأخر '+ar(-d)+' يوم':d===0?'ينتهي اليوم':'باقي '+ar(d)+' يوم')+'</span>'}function projectActions(n){return '<div class="actions"><button class="text-btn" onclick="openAdd(\''+n.id+'\')">إضافة مشروع فرعي</button><button class="text-btn" onclick="go(\'detail\',\''+n.id+'\')">التفاصيل</button><button class="text-btn" onclick="openEdit(\''+n.id+'\')">تعديل</button><button class="text-btn danger" onclick="askDelete(\''+n.id+'\')">حذف</button></div>'}function financialMeter(n){return '<div class="mini-money"><span>الموزع: <b>'+money(allocated(n.id))+' ر.س</b></span><span>المتبقي: <b>'+money(remain(n))+' ر.س</b></span></div><div class="progress"><i style="width:'+(n.budget?Math.min(100,allocated(n.id)/n.budget*100):0)+'%"></i></div>'}function groupedChildren(n,depth=1){return children(n.id).map(c=>'<div class="group-child" style="--depth:'+Math.min(depth,3)+'"><div class="group-title"><span class="child-label">مشروع فرعي</span><strong>'+esc(c.name)+'</strong><small>'+esc(c.code)+' · '+esc(c.status)+'</small></div><div class="group-amount"><span>المبلغ المخصص</span><strong class="money">'+money(c.budget)+' <small>ر.س</small></strong>'+financialMeter(c)+'</div><div class="group-time">'+countdown(c)+'<small>'+humanDate(c.due)+'</small></div>'+projectActions(c)+'</div>'+groupedChildren(c,depth+1)).join('')}function projectGroup(n){return '<article class="project-group" data-project-group="'+n.id+'"><div class="group-main"><div class="group-title"><strong>'+esc(n.name)+'</strong><small>'+esc(n.code)+' · '+esc(n.status)+' · '+ar(children(n.id).length)+' مشاريع فرعية</small></div><div class="group-amount"><span>المبلغ الكامل للمشروع</span><strong class="money">'+money(n.budget)+' <small>ر.س</small></strong>'+financialMeter(n)+'</div><div class="group-time">'+countdown(n)+'<small>'+humanDate(n.due)+'</small></div>'+projectActions(n)+'</div>'+groupedChildren(n)+'</article>'}function table(ns,title,action=''){return '<section class="panel"><div class="panel-head"><h2>'+title+'</h2>'+action+'</div>'+(ns.length?'<div class="project-groups">'+ns.map(projectGroup).join('')+'</div>':'<div class="empty"><span class="empty-mark">'+icon('folder')+'</span>لا توجد مشاريع هنا حتى الآن. يمكنك إضافة مشروع جديد.</div>')+'</section>'}function render(){document.getElementById('backupIcon').innerHTML=icon('download');brandIcon.innerHTML=icon('grid');today.textContent=new Date().toLocaleDateString('ar-SA',{calendar:'gregory',weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('navigation').innerHTML='<button class="nav '+(view==='home'?'active':'')+'" onclick="go(\'home\')">'+icon('grid')+'الرئيسية</button>'+data.years.slice().sort((a,b)=>b-a).map(y=>'<button class="nav '+(view==='year'&&selected===y?'active':'')+'" onclick="go(\'year\','+y+')">'+icon('calendar')+'مشاريع سنة '+ar(y)+'<span class="year-count">'+ar(data.nodes.filter(n=>!n.parent&&n.year===y).length)+'</span></button>').join('');let html='';const roots=data.nodes.filter(n=>!n.parent),budget=total(roots),used=roots.reduce((s,n)=>s+allocated(n.id),0);
if(view==='home'){pageLabel.textContent='الرئيسية';const due=alerts();html='<div class="intro"><div><h1>نظرة عامة</h1><p>المشاريع الأساسية والفرعية التي قرب موعد انتهائها</p></div><div class="actions"><button class="primary" onclick="openAdd()">'+icon('plus')+'إضافة مشروع جديد</button></div></div><section class="panel"><div class="panel-head"><div><h2>مشاريع تحتاج المتابعة</h2><p>الأقرب للانتهاء يظهر أولاً</p></div><span class="tag">'+ar(due.length)+' مشاريع</span></div>'+(due.length?'<div class="urgent-grid">'+due.map(n=>'<button class="urgent '+(days(n)<0?'overdue':'')+'" onclick="go(\'detail\',\''+n.id+'\')"><div class="urgent-top"><span>'+esc(n.code)+'</span><span>'+ar(n.year)+'</span></div><strong>'+esc(n.name)+'</strong><div class="path">'+esc(path(n))+'</div><div class="urgent-bottom"><span>'+humanDate(n.due)+'</span><span class="badge '+(days(n)<0?'red':'')+'">'+(days(n)<0?'متأخر '+ar(-days(n))+' يوم':days(n)===0?'ينتهي اليوم':'باقي '+ar(days(n))+' يوم')+'</span></div></button>').join('')+'</div>':'<div class="empty"><span class="empty-mark">'+icon('clock')+'</span>لا توجد مشاريع قريبة من الانتهاء.</div>')+'</section>'}
if(view==='year'){const ns=roots.filter(n=>n.year===selected);pageLabel.textContent='سنة '+ar(selected);html='<div class="intro"><div><h1>مشاريع سنة '+ar(selected)+'</h1><p>المشاريع الأساسية وقيمها ومشاريعها الفرعية</p></div><button class="primary" onclick="openAdd()">'+icon('plus')+'إضافة مشروع جديد</button></div><div class="stats">'+stat('المشاريع الأساسية',ar(ns.length),'مشاريع السنة','folder')+stat('المشاريع',ar(projectNodes().filter(n=>n.year===selected).length),'رئيسية وفرعية','grid')+stat('المبلغ المعتمد',money(total(ns))+' <span class="unit">ر.س</span>','إجمالي قيم المشاريع','wallet')+stat('المتبقي للتوزيع',money(total(ns)-ns.reduce((s,n)=>s+allocated(n.id),0))+' <span class="unit">ر.س</span>','داخل المشاريع الأساسية','wallet')+'</div>'+table(ns,'مشاريع السنة')}
if(view==='detail'){const n=get(selected);if(!n){go('home');return}pageLabel.textContent=n.name;const chain=[];let cur=n;while(cur){chain.unshift(cur);cur=get(cur.parent)}const cs=children(n.id),ongoing=total(cs.filter(c=>c.status!=='مقترح')),proposed=total(cs.filter(c=>c.status==='مقترح'));html='<div class="breadcrumb"><button onclick="go(\'year\','+n.year+')">'+ar(n.year)+'</button>'+chain.map(c=>'<span>/</span><button onclick="go(\'detail\',\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div><div class="intro"><div><h1>'+esc(n.name)+'</h1><p>'+esc(n.code)+' · '+(n.parent?'مشروع فرعي':'مشروع أساسي')+'</p></div><div class="actions"><button class="secondary" onclick="openEdit(\''+n.id+'\')">تعديل</button><button class="text-btn danger" onclick="askDelete(\''+n.id+'\')">حذف</button></div></div><div class="stats">'+stat('المبلغ المعتمد',money(n.budget)+' <span class="unit">ر.س</span>','سقف التوزيع الداخلي','wallet')+stat('المشاريع القائمة',money(ongoing)+' <span class="unit">ر.س</span>','مبالغ المشاريع غير المقترحة','folder')+stat('المشاريع المقترحة',money(proposed)+' <span class="unit">ر.س</span>','محجوزة ضمن سقف التوزيع','folder')+stat('المتبقي للتوزيع',money(remain(n))+' <span class="unit">ر.س</span>','بعد القائمة والمقترحة','wallet')+'</div><section class="panel"><div class="detail-meta"><span>الحالة: '+badge(n)+'</span><span>تاريخ الانتهاء: <b>'+humanDate(n.due)+'</b></span><span>التكاليف المتاحة بعد القائمة: <b>'+money(n.budget-ongoing)+' ر.س</b></span></div>'+(n.notes?'<div style="padding:0 25px 20px;font-size:14px;white-space:pre-wrap">'+esc(n.notes)+'</div>':'')+'</section>'+table(cs,'المشاريع الفرعية','<button class="primary" onclick="openAdd(\''+n.id+'\')">'+icon('plus')+'إضافة مشروع فرعي'+'</button>')}
content.innerHTML=html}
function option(v,label,sel){return '<option value="'+esc(v)+'" '+(String(v)===String(sel)?'selected':'')+'>'+esc(label)+'</option>'}function openAdd(parent=null){editing=null;addParent=parent;addType='project';buildForm(null)}function openEdit(id){editing=id;addParent=get(id).parent;addType='project';buildForm(get(id))}function buildForm(n){tenderDrafts=[];tenderCount=0;modalTitle.textContent=n?'تعديل المشروع':addParent?'إضافة مشروع فرعي داخل '+get(addParent).name:'إضافة مشروع جديد';const yr=n?.year||get(addParent)?.year||(view==='year'?selected:sampleYear);fields.innerHTML='<label>'+(!addParent?'اسم المشروع الأساسي':'اسم المشروع')+'<input name="name" required maxlength="160" value="'+esc(n?.name||'')+'"></label><label>المبلغ الكامل للمشروع (ر.س)<input name="budget" type="number" min="0" step="0.01" required value="'+(n?n.budget/100:'')+'"></label><label class="wide">'+(n?'عدد المشاريع الجديدة':'عدد المشاريع')+'<input name="tenderCount" type="number" min="0" max="1000" step="1" value="0" oninput="setTenderCount(this.value)"><span class="hint">صفر إذا كان المشروع منفردًا'+(n?' · المشاريع الحالية محفوظة وتُعدّل من القائمة':'')+'</span></label><div class="wide tender-forms" id="tenderForms"></div><div class="wide" id="tenderSummary" aria-live="polite"></div>'+(!n&&!addParent?'<label>السنة<input name="year" type="number" min="2000" max="2200" value="'+yr+'" required></label>':'')+'<label>رقم المشروع<input name="code" required maxlength="80" value="'+esc(n?.code||'')+'"></label><label>الحالة<select name="status">'+['مقترح','لم يبدأ','جارٍ التنفيذ','مكتمل'].map(s=>option(s,s,n?.status||'لم يبدأ')).join('')+'</select></label><label>تاريخ الانتهاء<input name="due" type="date" value="'+esc(n?.due||'')+'"></label><label class="wide">ملاحظات<textarea name="notes" rows="3" maxlength="4000">'+esc(n?.notes||'')+'</textarea></label>';error.style.display='none';showBudget(addParent);editor.showModal()}
function setTenderCount(value){const count=Number(value);if(!Number.isInteger(count)||count<0||count>1000){fail('أدخل عدد مشاريع صحيحًا من صفر إلى ١٠٠٠.');return}const f=new FormData(form);for(let i=0;i<tenderCount;i++){tenderDrafts[i]={name:f.get('tName'+i)||'',code:f.get('tCode'+i)||'',budget:f.get('tBudget'+i)||'',status:f.get('tStatus'+i)||'لم يبدأ',due:f.get('tDue'+i)||'',notes:f.get('tNotes'+i)||''}}tenderCount=count;document.getElementById('tenderForms').innerHTML=Array.from({length:count},(_,i)=>{const d=tenderDrafts[i]||{};return '<fieldset class="tender-card"><legend>المشروع الفرعي '+ar(i+1)+'</legend><div class="fields"><label>اسم المشروع<input name="tName'+i+'" maxlength="160" required value="'+esc(d.name||'')+'"></label><label>مبلغ المشروع الفرعي (ر.س)<input name="tBudget'+i+'" type="number" min="0" step="0.01" required value="'+esc(d.budget||'')+'"></label><label>رقم المشروع<input name="tCode'+i+'" maxlength="80" placeholder="اختياري" value="'+esc(d.code||'')+'"></label><label>الحالة<select name="tStatus'+i+'">'+['مقترح','لم يبدأ','جارٍ التنفيذ','مكتمل'].map(st=>option(st,st,d.status||'لم يبدأ')).join('')+'</select></label><label>تاريخ الانتهاء<input name="tDue'+i+'" type="date" value="'+esc(d.due||'')+'"></label><label class="wide">ملاحظات<textarea rows="2" name="tNotes'+i+'" maxlength="4000">'+esc(d.notes||'')+'</textarea></label></div></fieldset>'}).join('');error.style.display='none';updateTenderSummary()}function updateTenderSummary(){const target=document.getElementById('tenderSummary');if(!target)return;const f=new FormData(form);let sum=0;for(let i=0;i<tenderCount;i++)sum+=amount(Number(f.get('tBudget'+i)||0));const existing=editing?allocated(editing):0,b=amount(Number(f.get('budget')||0)),available=b-existing-sum;target.innerHTML=tenderCount?'<div class="budget-note '+(available<0?'over-budget':'')+'">مجموع المشاريع الجديدة: <b>'+money(sum)+' ر.س</b><br>المتبقي من قيمة المشروع: <b>'+money(available)+' ر.س</b>'+(available<0?'<br>مجموع المشاريع يتجاوز قيمة المشروع.':'')+'</div>':''}form.addEventListener('input',updateTenderSummary);
function showBudget(id){const p=get(id);budgetNote.innerHTML=p?'<div class="budget-note">المتاح داخل '+esc(p.name)+': <b>'+money(remain(p)+(editing?get(editing).budget:0))+' ر.س</b></div>':''}function fail(s){error.textContent=s;error.style.display='block'}form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),old=get(editing),parent=old?old.parent:(addParent||null),p=get(parent),year=old?.year||p?.year||Number(f.get('year')),budget=amount(Number(f.get('budget'))),name=String(f.get('name')).trim(),code=String(f.get('code')).trim();if(!name||!code)return fail('أدخل الاسم والرقم.');if(!Number.isSafeInteger(budget)||budget<0)return fail('أدخل مبلغاً صالحاً.');if(!year||year<2000||year>2200)return fail('أدخل سنة صحيحة.');if(parent&&!p)return fail('المشروع الأب غير موجود.');if(old&&budget<allocated(old.id))return fail('مجموع المشاريع الداخلية '+money(allocated(old.id))+' ر.س. لا يمكن تخفيض القيمة إلى أقل من المبلغ الموزع.');if(p&&budget>remain(p)+(old?old.budget:0))return fail('المبلغ يتجاوز المتاح داخل '+p.name+'؛ الحد المتاح '+money(remain(p)+(old?old.budget:0))+' ر.س. عدّل قيمة المشروع الأب أولاً إذا احتجت مبلغاً أكبر.');const count=Number(f.get('tenderCount')||0);if(!Number.isInteger(count)||count<0||count>1000||count!==tenderCount)return fail('أدخل عدد مشاريع صحيحاً.');const tenders=[];for(let i=0;i<count;i++){const childName=String(f.get('tName'+i)||'').trim(),raw=f.get('tBudget'+i),childBudget=amount(Number(raw));if(!childName||raw===null||String(raw).trim()===''||!Number.isSafeInteger(childBudget)||childBudget<0)return fail('أكمل اسم ومبلغ المشروع الفرعي '+ar(i+1)+'.');tenders.push({name:childName,code:String(f.get('tCode'+i)||'').trim()||code+'-T'+((old?children(old.id).length:0)+i+1),budget:childBudget,status:String(f.get('tStatus'+i)||'لم يبدأ'),due:String(f.get('tDue'+i)||''),notes:String(f.get('tNotes'+i)||'').trim()})}if(total(tenders)+(old?allocated(old.id):0)>budget)return fail('مجموع مبالغ المشاريع يتجاوز قيمة المشروع. عدّل قيمة المشروع أو مبالغ المشاريع.');const node={id:old?.id||'n'+crypto.randomUUID(),parent,year,type:addType,name,code,budget,status:String(f.get('status')),due:String(f.get('due')||''),notes:String(f.get('notes')||'').trim()};if(old)Object.assign(old,node);else data.nodes.push(node);for(const t of tenders)data.nodes.push({...t,id:'n'+crypto.randomUUID(),parent:node.id,year,type:'project'});if(!data.years.includes(year))data.years.push(year);const saved=save();editor.close();render();if(saved)notify(old?'تم حفظ التعديلات':'تمت الإضافة بنجاح')};function descendants(id){return children(id).flatMap(n=>[n.id,...descendants(n.id)])}function askDelete(id){deleteId=id;const n=get(id),count=descendants(id).length;deleteText.textContent='هل تريد حذف «'+n.name+'»؟'+(count?' سيُحذف معه '+ar(count)+' من المشاريع التابعة له.':'')+' لا يمكن التراجع عن الحذف.';deleter.showModal()}deleteConfirm.onclick=()=>{const ids=new Set([deleteId,...descendants(deleteId)]),p=get(deleteId).parent;data.nodes=data.nodes.filter(n=>!ids.has(n.id));const saved=save();deleter.close();if(view==='detail'&&ids.has(selected)){view=p?'detail':'home';selected=p}render();if(saved)notify('تم الحذف وتحديث المبالغ المتبقية')};render();
</script></body></html>
